<!doctype html>
<html lang="es">
<head>

<title>Gestor de Locadores · ATU</title>
<!-- Lleva directo al aplicativo en pestaña completa (sin recuadro incrustado):

<meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/AKfycbzW2XeCcNHCo4SKhwMquBaGS4tDa7Ke_NUdbMja3yOd78sxNs5_OXsF3tQ6UZzt5-Nf/exec">
<style>
  :root{--bar:#13363d;--acc:#c9822b}
  html,body{margin:0;height:100%;background:#f4f6f7;color:#1f2d30;font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
  header{height:44px;background:var(--bar);color:#e8f1f3;display:flex;align-items:center;padding:0 16px;font-weight:700}
  main{max-width:520px;margin:12vh auto 0;padding:0 16px;text-align:center}
  a.btn{display:inline-block;margin-top:14px;color:#fff;background:var(--acc);text-decoration:none;padding:10px 18px;border-radius:8px;font-weight:600}

</head>
<body>
<header>Gestor de Locadores · ATU</header>
<main>
  <p>Abriendo el Gestor de Locadores…</p>

</main>
<script>
  var APP_URL = document.getElementById('ir').href;
  try { window.location.replace(APP_URL); } catch (e) {}
</script>
