<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base target="_top">
<title>Gestor de Locadores · ATU</title>
<style>
:root{
  --bg:#f4f6f7; --panel:#ffffff; --ink:#17252b; --ink2:#4b5d65; --mute:#7d8d94; --line:#dfe5e8; --line2:#eef2f4;
  --pri:#1f5f6b; --pri2:#2c7c8a; --priBg:#e6f0f2; --acc:#c9822b; --accBg:#fbf1e3;
  --ok:#3d7d4f; --okBg:#e7f3ea; --warn:#b07a12; --warnBg:#fdf4dc; --bad:#b0414c; --badBg:#fbe9eb; --info:#3c64a0; --infoBg:#e8eef8;
  --c1:#1f5f6b; --c2:#c9822b; --c3:#4a6fa5; --c4:#b5525c; --c5:#5b8c5a; --c6:#8a6fb0; --c7:#7d8d94;
  --r:10px; --sh:0 1px 2px rgba(16,40,48,.06),0 2px 8px rgba(16,40,48,.05);
  --mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13.5px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh;background:linear-gradient(90deg,#13363d 232px,var(--bg) 232px)}
aside{background:#13363d;color:#d7e6e9;padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;overflow:auto}
.brand{padding:4px 10px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:10px}
.brand b{display:block;font-size:15px;color:#fff;letter-spacing:.2px}
.brand span{font-size:11.5px;color:#9fbfc5}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;color:#cfe0e3;border:0;background:none;text-align:left;width:100%}
.nav:hover{background:rgba(255,255,255,.06)}
.nav.on{background:#235a64;color:#fff;font-weight:600}
.nav svg{width:17px;height:17px;flex:none;opacity:.9}
.nav .bdg{margin-left:auto;background:var(--acc);color:#fff;border-radius:20px;font-size:10.5px;padding:0 7px;font-weight:700}
.side-foot{margin-top:auto;font-size:11.5px;color:#9fbfc5;padding:12px 10px 0;border-top:1px solid rgba(255,255,255,.08)}
.side-foot .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#6fcf97;margin-right:6px}
.side-foot .dot.pend{background:#f2c94c}
main{padding:22px 26px 60px;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.top h1{font-size:21px;margin:0;font-weight:650;letter-spacing:-.2px}
.top p{margin:3px 0 0;color:var(--ink2)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.card h3{margin:0 0 12px;font-size:14px;font-weight:650;display:flex;align-items:center;gap:8px}
.card h3 small{font-weight:400;color:var(--mute);font-size:12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.kpi .l{font-size:11.5px;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.kpi .v{font-size:22px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.kpi .s{font-size:12px;color:var(--mute);margin-top:2px}
.up{color:var(--bad)} .down{color:var(--ok)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:550;white-space:nowrap}
.btn:hover{border-color:#b8c6cb;background:#fafcfc}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri2)}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.danger{color:var(--bad);border-color:#e7c3c7}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px}
input[type=text],input[type=number],input[type=search],select,textarea{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid #9cc7cf;outline-offset:0;border-color:#9cc7cf}
select{padding-right:26px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2);font-weight:550}
.search{position:relative;flex:1;min-width:260px}
.search input{width:100%;padding-left:34px;height:38px;font-size:14px}
.search svg{position:absolute;left:10px;top:10px;width:18px;height:18px;color:var(--mute)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
.filters select{width:100%}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff;max-height:calc(100vh - 290px)}
table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:#f0f4f5;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink2);font-weight:650;z-index:1;white-space:nowrap;cursor:default}
th.s{cursor:pointer} th.s:hover{color:var(--ink)}
td.n,th.n{text-align:right;white-space:nowrap}
td.small{min-width:150px;max-width:280px}
tbody tr:hover td{background:#f7fafb}
tr.click{cursor:pointer}
tr.sel td{background:#eef6f7}
tr.tot td{background:#eef3f4;font-weight:700;border-top:1px solid var(--line)}
tr.lvl0 td{font-weight:650;background:#fafcfc}
tr.lvl1 td:first-child{padding-left:30px}
.ctree td:first-child{min-width:340px}
.tag{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11.5px;font-weight:600;background:var(--line2);color:var(--ink2);white-space:nowrap}
.tag.ok{background:var(--okBg);color:var(--ok)} .tag.warn{background:var(--warnBg);color:var(--warn)} .tag.bad{background:var(--badBg);color:var(--bad)} .tag.info{background:var(--infoBg);color:var(--info)} .tag.pri{background:var(--priBg);color:var(--pri)} .tag.acc{background:var(--accBg);color:#9a5f14}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--mute)} .small{font-size:12px}
.pager{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-top:10px;color:var(--ink2);flex-wrap:wrap}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:minmax(120px,38%) 1fr 128px;gap:10px;align-items:center;font-size:12.5px}
.bar .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
.bar .tr{height:16px;background:var(--line2);border-radius:4px;overflow:hidden;display:flex}
.bar .tr i{display:block;height:100%}
.bar .vl{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;min-width:64px;text-align:right}
.bar.click{cursor:pointer;border-radius:6px} .bar.click:hover .lb{color:var(--pri);text-decoration:underline}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cols{display:flex;align-items:flex-end;gap:8px;height:170px;padding-top:10px}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.cols .c i{display:block;width:100%;max-width:56px;background:var(--c1);border-radius:5px 5px 0 0}
.cols .c b{font-size:12px;font-variant-numeric:tabular-nums}
.cols .c span{font-size:11px;color:var(--mute);text-align:center;line-height:1.2;height:28px}
.hide{display:none!important}
.drop{border:2px dashed #b9cbd0;border-radius:12px;padding:26px;text-align:center;background:#fbfdfd;cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--pri2);background:var(--priBg)}
.drop b{display:block;font-size:15px;margin-bottom:4px}
.steps{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.step{padding:6px 12px;border-radius:20px;background:var(--line2);color:var(--ink2);font-weight:600;font-size:12px}
.step.on{background:var(--pri);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;cursor:pointer;text-align:left;min-width:150px}
.chip b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.chip span{font-size:11.5px;color:var(--ink2);font-weight:600}
.chip.on{outline:2px solid var(--pri);border-color:var(--pri)}
.chip .sw{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
/* drawer & modal */
.ov{position:fixed;inset:0;background:rgba(15,30,35,.38);z-index:40;display:flex;justify-content:flex-end}
.drawer{width:min(760px,100%);background:#fff;height:100%;overflow:auto;box-shadow:-10px 0 30px rgba(0,0,0,.15);display:flex;flex-direction:column}
.drawer header{padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.drawer header h2{margin:0;font-size:17px}
.drawer .body{padding:18px 22px;flex:1}
.drawer footer{padding:12px 22px;border-top:1px solid var(--line);display:flex;gap:8px;position:sticky;bottom:0;background:#fff}
fieldset{border:1px solid var(--line);border-radius:10px;padding:12px 14px 14px;margin:0 0 14px}
legend{font-size:12px;font-weight:700;color:var(--pri);padding:0 6px;text-transform:uppercase;letter-spacing:.4px}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fg .full{grid-column:1/-1}
.fg input,.fg select,.fg textarea{width:100%}
.chk{display:flex;gap:14px;flex-wrap:wrap}
.chk label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ink)}
.mod-ov{position:fixed;inset:0;background:rgba(15,30,35,.42);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:14px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal header{padding:16px 20px 0;font-size:16px;font-weight:650}
.modal .body{padding:12px 20px}
.modal footer{padding:12px 20px 16px;display:flex;justify-content:flex-end;gap:8px}
.toasts{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:80}
.toast{background:#17323a;color:#fff;padding:10px 14px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:380px;font-size:13px}
.toast.bad{background:#8e2f39}
.note{background:var(--infoBg);color:#2b4a78;border-radius:10px;padding:10px 14px;font-size:12.5px}
.note.warn{background:var(--warnBg);color:#7a560c}
.qlist{display:flex;flex-direction:column;gap:8px}
.qitem{border:1px solid var(--line);border-radius:10px;background:#fff}
.qitem>summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;gap:12px;align-items:center}
.qitem>summary::-webkit-details-marker{display:none}
.qitem>summary .cnt{font-weight:700;font-size:16px;min-width:46px;text-align:right;font-variant-numeric:tabular-nums}
.qitem .qb{padding:0 14px 14px}
.sev{width:9px;height:9px;border-radius:50%;flex:none}
mark{background:#fde9a8;color:inherit;padding:0 1px;border-radius:2px}
.spin{width:34px;height:34px;border:4px solid #d6e3e6;border-top-color:var(--pri);border-radius:50%;margin:0 auto;animation:sp 0.9s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.diff-old{background:#fbe9eb;text-decoration:line-through;color:#8e2f39;padding:0 4px;border-radius:4px}
.diff-new{background:#e7f3ea;color:#2c6a3e;padding:0 4px;border-radius:4px}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 12px;cursor:pointer;font-weight:550}
.seg button.on{background:var(--pri);color:#fff}
#printArea{display:none}
/* el asistente no tapa la ficha ni las ventanas de confirmación */
body:has(.ov) .atb-toggle,body:has(.ov) .atb-teaser,body:has(.mod-ov) .atb-toggle,body:has(.mod-ov) .atb-teaser{display:none!important}
@media print{
  body{background:#fff}
  .app,.toasts,.ov,.mod-ov{display:none!important}
  #printArea{display:block;font-size:11px;color:#000}
  #printArea table{font-size:10.5px}
  #printArea th{position:static;background:#e8eef0!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printArea tr.tot td{background:#eef3f4!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4 landscape;margin:12mm}
}
.ph{display:flex;justify-content:space-between;border-bottom:2px solid #1f5f6b;padding-bottom:8px;margin-bottom:12px}
.ph h1{font-size:16px;margin:0} .ph .m{font-size:11px;color:#555;text-align:right}
.pk{display:flex;gap:18px;margin:8px 0 12px} .pk div{border:1px solid #ccc;border-radius:6px;padding:6px 10px} .pk b{display:block;font-size:14px}
@media (max-width:900px){
  .app{grid-template-columns:1fr;background:var(--bg)}
  aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:10px}
  .brand,.side-foot{display:none}
  .nav{width:auto;padding:7px 9px}
  .nav span.t{display:none}
  main{padding:16px}
  .g2,.g3{grid-template-columns:1fr}
  .fg{grid-template-columns:1fr}
}
</style>
</head>

</div>
<div class="toasts" id="toasts"></div>
<div id="printArea"></div>
<input type="file" id="fileAny" class="hide">
